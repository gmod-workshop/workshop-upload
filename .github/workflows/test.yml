name: Test

on:
  push:
    branches: [ main ]
    paths-ignore:
        - '**.md'
  pull_request:
    paths-ignore:
        - '**.md'

jobs:
    build:
        name: Build

        strategy:
            matrix:
                runs-on: [ ubuntu-latest, macos-latest, windows-latest ]

        runs-on: ${{ matrix.runs-on }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                node-version: 24.x
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Check dist is up to date
              shell: bash
              run: |
                if [ -n "$(git status --porcelain -- dist)" ]; then
                  git status --short -- dist
                  echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
                  exit 1
                fi

            # GitHub runs dist/index.js without node_modules, so it must not import any package.
            - name: Smoke test the action without node_modules
              shell: bash
              run: |
                dir="$(mktemp -d)"
                cp -r dist action.yml default_icon.png package.json "$dir/"
                cd "$dir"
                output="$(node dist/index.js 2>&1 || true)"
                echo "$output"
                echo "$output" | grep -q "Input required and not supplied: username"

            - name: Test
              run: npm test -- --run
