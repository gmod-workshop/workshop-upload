name: "Garry's Mod Workshop Upload"
author: 'dhkatz'
description: "Upload to the Steam Workshop: Garry's Mod addons, Slay the Spire 2 mods, or any other game's items."

branding:
  icon: 'arrow-up-circle'
  color: 'blue'

inputs:
  username:
    description: 'Steam username'
    required: true
    default: 'anonymous'

  password:
    description: 'Steam password'
    required: false
  totp:
    description: 'Steam TOTP code'
    required: false
  vdf:
    description: 'Steam account VDF'
    required: false

  appid:
    description: 'Steam app ID of the game. Picks how the folder is prepared: 4000 (Garry''s Mod) packs it into a .gma, 2868840 (Slay the Spire 2) checks the mod manifests, any other game uploads it as is.'
    required: false
    default: '4000'

  id:
    description: 'Workshop item ID to update. Leave empty to create a new item (see the id output).'
    required: false

  changelog:
    description: 'Addon changelog'
    required: false
  markdown-changelog:
    description: 'Addon changelog (Markdown)'
    required: false

  icon:
    description: 'Addon icon (path to an image under 1 MB). New items use a default icon if this is empty.'
    required: false
  title:
    description: 'Addon title'
    required: false
  description:
    description: 'Addon description'
    required: false
  markdown-description:
    description: 'Addon description (Markdown)'
    required: false
  visibility:
    description: 'public, friends_only, private or unlisted (or 0-3). Leave empty to keep the current visibility.'
    required: false

  folder:
    description: 'Addon directory'
    required: true

outputs:
  id:
    description: 'The Workshop item ID that was published (useful after creating a new item)'

runs:
  using: 'node24'
  main: 'dist/index.js'
